name: MkDocs Deploy

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.x
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          cd my-website
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install google-genai beautifulsoup4 markdown

      - name: Generate Audio files
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cd my-website
          python generate_audio.py

      - name: Commit generated Audio files back to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[skip ci] Auto-generate Audio via Gemini TTS"
          file_pattern: my-website/docs/assets/audio/stephane/*

      - name: Build the MkDocs site
        run: |
          cd my-website
          mkdocs build --verbose

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./my-website/site
